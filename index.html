<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>NFC Nexus - Photo Viewer</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      background-color: #000000;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      user-select: none;
      -webkit-user-select: none;
    }

    /* Full-screen photo container */
    #viewer-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: #000000;
      overflow: hidden;
    }

    #photo-view {
      max-width: 100vw;
      max-height: 100vh;
      width: 100%;
      height: 100%;
      object-fit: contain;
      cursor: zoom-in;
      transition: transform 0.25s cubic-bezier(0.25, 1, 0.5, 1);
      will-change: transform;
    }

    #photo-view.covered {
      object-fit: cover;
      cursor: zoom-out;
    }

    /* Subtle loading spinner */
    #spinner {
      position: absolute;
      width: 44px;
      height: 44px;
      border: 3px solid rgba(255, 255, 255, 0.15);
      border-top-color: #00e5ff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      z-index: 10;
      display: none;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Minimal floating controls */
    .hint-toast {
      position: fixed;
      bottom: 24px;
      background: rgba(20, 20, 20, 0.75);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: #e0e0e0;
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 13px;
      letter-spacing: 0.2px;
      opacity: 0;
      transform: translateY(10px);
      transition: opacity 0.4s ease, transform 0.4s ease;
      pointer-events: none;
      z-index: 20;
    }

    .hint-toast.show {
      opacity: 1;
      transform: translateY(0);
    }

    /* Landing page (when accessed without ?img=) */
    #landing-page {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
      max-width: 520px;
      background: #0a0a0c;
      border: 1px solid #1f1f2e;
      border-radius: 24px;
      box-shadow: 0 12px 40px rgba(0, 229, 255, 0.08);
      margin: 16px;
    }

    #landing-page h1 {
      font-size: 28px;
      font-weight: 800;
      background: linear-gradient(135deg, #00e5ff 0%, #b388ff 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 8px;
    }

    #landing-page p {
      color: #9e9e9e;
      font-size: 15px;
      line-height: 1.5;
      margin-bottom: 24px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: #00e5ff;
      color: #000000;
      padding: 12px 24px;
      border-radius: 12px;
      font-weight: 700;
      font-size: 15px;
      text-decoration: none;
      transition: transform 0.15s ease, opacity 0.15s ease;
    }

    .btn:active {
      transform: scale(0.97);
    }

    .btn-secondary {
      background: #1a1a24;
      color: #ffffff;
      border: 1px solid #2d2d3f;
      margin-top: 10px;
    }
  </style>
</head>
<body>

  <div id="viewer-container">
    <div id="spinner"></div>
    <img id="photo-view" alt="NFC Photo">
  </div>

  <div id="hint-toast" class="hint-toast">Tap to toggle full-screen fill</div>

  <div id="landing-page">
    <h1>NFC Nexus</h1>
    <p>The Ultimate NFC Suite for Android. Host Card Emulation, Tag Cloning, Memory Inspection & Universal Photo Sharing.</p>
    <a href="https://github.com/maorrub/NFC-Nexus/releases/latest" class="btn">
      Download Latest APK
    </a>
    <a href="https://github.com/maorrub/NFC-Nexus" class="btn btn-secondary">
      View on GitHub
    </a>
  </div>

  <script>
    (function() {
      const urlParams = new URLSearchParams(window.location.search);
      let imgUrl = urlParams.get('img') || urlParams.get('url') || urlParams.get('photo');

      if (!imgUrl && window.location.hash && window.location.hash.length > 1) {
        imgUrl = decodeURIComponent(window.location.hash.substring(1));
      }

      const imgEl = document.getElementById('photo-view');
      const spinnerEl = document.getElementById('spinner');
      const landingEl = document.getElementById('landing-page');
      const toastEl = document.getElementById('hint-toast');

      if (!imgUrl) {
        document.getElementById('viewer-container').style.display = 'none';
        landingEl.style.display = 'flex';
        return;
      }

      spinnerEl.style.display = 'block';

      imgEl.onload = function() {
        spinnerEl.style.display = 'none';
        toastEl.classList.add('show');
        setTimeout(() => toastEl.classList.remove('show'), 2600);
      };

      imgEl.onerror = function() {
        spinnerEl.style.display = 'none';
        toastEl.textContent = 'Could not load image';
        toastEl.classList.add('show');
      };

      imgEl.src = imgUrl;

      imgEl.addEventListener('click', function() {
        imgEl.classList.toggle('covered');
        toastEl.textContent = imgEl.classList.contains('covered') ? 'Full Screen Fill' : 'Full Image Fit';
        toastEl.classList.add('show');
        setTimeout(() => toastEl.classList.remove('show'), 1500);
      });
    })();
  </script>
</body>
</html>
